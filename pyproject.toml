[project]
name = "algorithms"
version = "0.1.0"
description = "Dual-language algorithmic testing environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["."]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
